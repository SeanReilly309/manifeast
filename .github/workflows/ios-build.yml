name: iOS Build & Submit

# Trigger by pushing a tag like `ios-v1.0.3` OR running manually from the
# GitHub Actions UI. Both work from your iPhone in Safari:
#   • Manual: repo → Actions tab → "iOS Build & Submit" → Run workflow
#   • Tag:    create a release from the repo page with tag `ios-v...`
on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to use (overrides auto-increment)'
        required: false
        type: string

jobs:
  build:
    name: Build iOS .ipa on macOS runner
    runs-on: macos-14  # Sonoma, ships with Xcode 15
    timeout-minutes: 60

    env:
      NODE_VERSION: '20'
      # These come from the repo's Actions → Secrets & variables → Actions
      APP_STORE_CONNECT_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64:  ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      IOS_CERT_P12_BASE64:           ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_P12_PASSWORD:         ${{ secrets.IOS_CERT_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID:                   ${{ secrets.IOS_TEAM_ID }}
      APP_BUNDLE_ID:                 com.manifeast.app
      # The URL your compiled web bundle hits at runtime (production API host)
      REACT_APP_BACKEND_URL:         ${{ secrets.REACT_APP_BACKEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build production web bundle
        working-directory: frontend
        run: yarn build

      - name: Add iOS platform (first-run) & sync
        working-directory: frontend
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set version & build number
        working-directory: frontend/ios/App
        run: |
          # Read the marketing version from package.json (fallback 1.0.0)
          MARKETING=$(node -p "require('../../package.json').version || '1.0.0'")
          # Auto-increment build number using the GitHub run number (monotonic)
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          echo "Version: $MARKETING ($BUILD_NUMBER)"

      - name: Decode signing assets
        run: |
          mkdir -p $RUNNER_TEMP/signing
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/signing/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/signing/profile.mobileprovision
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > $RUNNER_TEMP/signing/AuthKey.p8

      - name: Import certificate to keychain
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PW="temppw$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/signing/cert.p12 -k "$KEYCHAIN" -P "$IOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i $RUNNER_TEMP/signing/profile.mobileprovision | grep -aA1 UUID | grep string | sed -E 's/.*<string>(.+)<\/string>.*/\1/')
          cp $RUNNER_TEMP/signing/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build & archive
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            archive | xcpretty

      - name: Write export options plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates | xcpretty
          ls -la "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact (for debugging / manual submit)
        uses: actions/upload-artifact@v4
        with:
          name: Manifeast-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Prepare ASC API key for altool
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp $RUNNER_TEMP/signing/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Submit to App Store Connect (TestFlight)
        run: |
          IPA_FILE=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
