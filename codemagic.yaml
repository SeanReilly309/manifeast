workflows:
  ios-testflight:
    name: iOS → TestFlight (Manifeast)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: manifeast_asc   # created in Codemagic UI

    environment:
      vars:
        BUNDLE_ID: "ie.manifeast.app"
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        REACT_APP_BACKEND_URL: "https://whatieat.emergent.host"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install web deps + build
        script: |
          set -e
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install ajv@^8 --legacy-peer-deps --no-audit --no-fund
          CI=false npm run build

      - name: Add & sync Capacitor iOS
        script: |
          set -e
          cd frontend
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          # Generate all iOS app icon sizes from resources/icon.png
          npm install --no-save --legacy-peer-deps @capacitor/assets
          npx @capacitor/assets generate --iconBackgroundColor "#87A186" --iconBackgroundColorDark "#87A186" --splashBackgroundColor "#87A186" --splashBackgroundColorDark "#87A186" --ios

      - name: Set bundle id & version
        script: |
          set -e
          cd frontend/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true
          # Add iOS permission usage strings (required when the app accesses the
          # camera or photo library — without these, iOS force-quits the app
          # the moment the picker tries to launch).
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Manifeast uses the camera so you can snap a photo of your fridge or the meal on your plate.'" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Manifeast uses the camera so you can snap a photo of your fridge or the meal on your plate.'" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Manifeast reads photos from your library so you can pick an existing fridge or meal photo.'" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Manifeast reads photos from your library so you can pick an existing fridge or meal photo.'" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Manifeast can save a copy of the photo you took to your library.'" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Manifeast can save a copy of the photo you took to your library.'" App/Info.plist
          echo "=== Info.plist after permission patch ==="
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" App/Info.plist

      - name: Fetch or create signing files
        script: |
          set -e
          keychain initialize
          # Revoke ALL existing distribution certificates whose private keys we no longer have.
          echo "=== Revoking any orphaned distribution certificates ==="
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            RAW_JSON=$(app-store-connect certificates list --type "$CERT_TYPE" --json || echo "[]")
            CERT_IDS=$(echo "$RAW_JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print(' '.join([c['id'] for c in d]))" || echo "")
            for cert_id in $CERT_IDS; do
              echo "Revoking $CERT_TYPE certificate $cert_id"
              app-store-connect certificates delete "$cert_id" --ignore-not-found
            done
          done
          # Generate a fresh RSA private key for the new distribution certificate
          openssl genrsa 2048 > /tmp/cert_private_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_private_key.pem \
            --create
          keychain add-certificates

      - name: Force manual signing in Xcode project
        script: |
          set -e
          cd frontend/ios/App
          # Extract profile info from the downloaded .mobileprovision
          PROFILE_FILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            PROFILE_FILE=$(ls "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          fi
          echo "Using profile file: $PROFILE_FILE"
          # Decode the .mobileprovision to plain plist XML into a temp file
          security cms -D -i "$PROFILE_FILE" -o /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "=== Profile entitlements ==="
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist || true
          echo "=== Current App.entitlements ==="
          cat App/App.entitlements 2>/dev/null || echo "(no entitlements file)"
          # Reset the app entitlements to an empty dict.
          # Capacitor's default entitlements may include capabilities not on the auto-created
          # provisioning profile, which causes archive to fail with status 65.
          cat > App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF
          echo "=== Reset App.entitlements to empty ==="
          cat App/App.entitlements
          # Patch pbxproj to use manual signing with this exact profile
          export PROFILE_NAME PROFILE_UUID TEAM_ID
          python3 <<'PY'
          import os, re, pathlib
          team = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]
          p = pathlib.Path("App.xcodeproj/project.pbxproj")
          text = p.read_text()
          # Remove any old signing settings we might duplicate (stale team IDs, wrong identities)
          for key in ["DEVELOPMENT_TEAM", "PROVISIONING_PROFILE_SPECIFIER", "PROVISIONING_PROFILE", "CODE_SIGN_IDENTITY"]:
              text = re.sub(r'\n\s*' + key + r' = [^;]*;', '', text)
          # Switch signing style to Manual for BOTH Debug and Release configs
          text = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', text)
          # After each CODE_SIGN_STYLE = Manual; line add signing settings
          insert = (
              'CODE_SIGN_STYLE = Manual;\n'
              f'\t\t\t\tDEVELOPMENT_TEAM = {team};\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
              f'\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";'
          )
          text = text.replace('CODE_SIGN_STYLE = Manual;', insert)
          # Bump minimum iOS version to 15.0 (Apple requirement from Spring 2027)
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', text)
          # Restrict to iPhone-only (TARGETED_DEVICE_FAMILY = 1). Capacitor defaults
          # to "1,2" (iPhone + iPad) which forces you to submit iPad screenshots too.
          text = re.sub(r'TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;', 'TARGETED_DEVICE_FAMILY = "1";', text)
          p.write_text(text)
          print("Patched pbxproj: manual signing + iOS 15.0 + iPhone-only")
          PY
          echo "=== Final signing settings in pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY" App.xcodeproj/project.pbxproj || true
          # Generate export_options.plist required by xcode-project build-ipa
          cat > "$HOME/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "=== export_options.plist ==="
          cat "$HOME/export_options.plist"

      - name: Build .ipa
        script: |
          set -e
          cd frontend/ios/App
          # Run xcodebuild directly so we see the exact error (xcode-project wrapper hides details)
          set +e
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist)" \
            PROVISIONING_PROFILE_SPECIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)" \
            archive 2>&1 | tee /tmp/xcodebuild_archive.log
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" != "0" ]; then
            echo "=== ARCHIVE FAILED - error lines from xcodebuild ==="
            grep -E "error:|Error:" /tmp/xcodebuild_archive.log | head -50 || true
            echo "=== Last 100 lines of xcodebuild output ==="
            tail -100 /tmp/xcodebuild_archive.log
            exit "$ARCHIVE_STATUS"
          fi
          # Export the .ipa from the archive
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -allowProvisioningUpdates

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testing"
