workflows:
  ios-testflight:
    name: iOS → TestFlight (Manifeast)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: manifeast_asc   # created in Codemagic UI

    environment:
      vars:
        BUNDLE_ID: "ie.manifeast.ios"
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        REACT_APP_BACKEND_URL: "https://manifest.ie"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install web deps + build
        script: |
          set -e
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install ajv@^8 --legacy-peer-deps --no-audit --no-fund
          CI=false npm run build

      - name: Add & sync Capacitor iOS
        script: |
          set -e
          cd frontend
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set bundle id & version
        script: |
          set -e
          cd frontend/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true

      - name: Fetch or create signing files
        script: |
          set -e
          keychain initialize
          # Revoke ALL existing distribution certificates whose private keys we no longer have.
          echo "=== Revoking any orphaned distribution certificates ==="
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            RAW_JSON=$(app-store-connect certificates list --type "$CERT_TYPE" --json || echo "[]")
            CERT_IDS=$(echo "$RAW_JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print(' '.join([c['id'] for c in d]))" || echo "")
            for cert_id in $CERT_IDS; do
              echo "Revoking $CERT_TYPE certificate $cert_id"
              app-store-connect certificates delete "$cert_id" --ignore-not-found
            done
          done
          # Generate a fresh RSA private key for the new distribution certificate
          openssl genrsa 2048 > /tmp/cert_private_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_private_key.pem \
            --create
          keychain add-certificates

      - name: Force manual signing in Xcode project
        script: |
          set -e
          cd frontend/ios/App
          # Extract profile info from the downloaded .mobileprovision
          PROFILE_FILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            PROFILE_FILE=$(ls "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          fi
          echo "Using profile file: $PROFILE_FILE"
          # Decode the .mobileprovision to plain plist XML into a temp file
          security cms -D -i "$PROFILE_FILE" -o /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          # Patch pbxproj to use manual signing with this exact profile
          export PROFILE_NAME PROFILE_UUID TEAM_ID
          python3 <<'PY'
          import os, re, pathlib
          team = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]
          p = pathlib.Path("App.xcodeproj/project.pbxproj")
          text = p.read_text()
          # Remove any old signing settings we might duplicate
          for key in ["DEVELOPMENT_TEAM", "PROVISIONING_PROFILE_SPECIFIER", "PROVISIONING_PROFILE", "CODE_SIGN_IDENTITY"]:
              text = re.sub(r'\n\s*' + key + r' = [^;]*;', '', text)
          # Switch signing style to Manual
          text = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', text)
          # After each CODE_SIGN_STYLE = Manual; line add signing settings
          insert = (
              'CODE_SIGN_STYLE = Manual;\n'
              f'\t\t\t\tDEVELOPMENT_TEAM = {team};\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
          )
          text = text.replace('CODE_SIGN_STYLE = Manual;', insert)
          p.write_text(text)
          print("Patched pbxproj with manual signing")
          PY
          echo "=== Final signing settings in pbxproj ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY" App.xcodeproj/project.pbxproj || true
          # Generate export_options.plist required by xcode-project build-ipa
          cat > "$HOME/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "=== export_options.plist ==="
          cat "$HOME/export_options.plist"

      - name: Build .ipa
        script: |
          set -e
          cd frontend/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testing"
