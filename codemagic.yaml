workflows:
  ios-testflight:
    name: iOS → TestFlight (Manifeast)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: manifeast_asc   # created in Codemagic UI

    environment:
      vars:
        BUNDLE_ID: "ie.manifeast.ios"
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        REACT_APP_BACKEND_URL: "https://manifest.ie"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install web deps + build
        script: |
          set -e
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install ajv@^8 --legacy-peer-deps --no-audit --no-fund
          CI=false npm run build

      - name: Add & sync Capacitor iOS
        script: |
          set -e
          cd frontend
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set bundle id & version
        script: |
          set -e
          cd frontend/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true

      - name: Fetch or create signing files
        script: |
          set -e
          keychain initialize
          # Revoke any existing distribution certificates whose private key we no longer have.
          # This clears the way for creating a fresh cert we control.
          echo "=== Revoking orphaned distribution certificates ==="
          CERT_IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import sys, json; print(' '.join([c['id'] for c in json.load(sys.stdin)]))" || echo "")
          for cert_id in $CERT_IDS; do
            echo "Revoking certificate $cert_id"
            app-store-connect certificates delete "$cert_id" --ignore-not-found || true
          done
          # Generate a fresh RSA private key for the new distribution certificate
          openssl genrsa 2048 > /tmp/cert_private_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_private_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project frontend/ios/App/App.xcodeproj \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

      - name: Build .ipa
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testing"
