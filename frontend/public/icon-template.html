<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 512px; height: 512px; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .tile {
      width: 512px; height: 512px;
      border-radius: 112px;
      background:
        radial-gradient(circle at 32% 28%, #F2CC8F 0%, #E07A5F 48%, #C96B52 100%);
      position: relative;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 -40px 80px rgba(45,48,71,0.18);
    }
    .y {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 360px;
      line-height: 1;
      color: #FAFAF7;
      margin-top: -18px;
      text-shadow: 0 8px 30px rgba(45,48,71,0.25);
    }
    .spark {
      position: absolute;
      top: 80px; right: 110px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #FAFAF7;
      box-shadow: 0 0 30px rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <div class="tile">
    <div class="y">m</div>
    <div class="spark"></div>
  </div>
</body>
</html>
